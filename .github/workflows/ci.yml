name: Loomstead CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Static check and portfolio entry verification
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Run the Python entry points directly to keep these checks explicit.
      - name: Compile and static check
        run: |
          python -m compileall -q backend scripts
          python scripts/check.py

      - name: Run presentation tests
        run: |
          python -m pytest -q scripts/tests

      - name: Portfolio entry check
        run: |
          python scripts/check_portfolio_entry.py

      # The steps above call `python` directly, which setup-python always
      # provides. That masked the npm entry points staying Windows-only, so the
      # documented public interface is now exercised as well.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify documented npm entry points
        run: |
          npm run schema:check
          npm run content:check
          npm run portfolio:check
          npm run portfolio:verify
